[project]
name = "logic"
version = "0.1.0"
description = "Python package with a domain to be defined."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ty.environment]
python-version = "3.14"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]
